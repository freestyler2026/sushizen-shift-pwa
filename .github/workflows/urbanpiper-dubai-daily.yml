name: UrbanPiper Dubai — Daily Revenue & Talabat/Smiles counts

# Dubai Revenue by location (all platforms) and the Talabat / Smiles order counts,
# read from UrbanPiper Atlas by the backend. The tokens live on Heroku
# (URBANPIPER_TOKEN, URBANPIPER_RAMEN_TOKEN) and last 7 days; refresh them with
#   node scripts/urbanpiper/setup-session.js sushi   (and ramen)
# A run with an expired token fails here, so it shows on the Actions page.

on:
  schedule:
    # 02:30 UTC = 06:30 Dubai, after the business day has closed.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'From (YYYY-MM-DD). Default: 7 days back.'
        required: false
        default: ''
      date_to:
        description: 'To (YYYY-MM-DD). Default: yesterday (Dubai).'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync from UrbanPiper Atlas
        run: |
          BODY=$(jq -nc --arg f "${{ github.event.inputs.date_from }}" --arg t "${{ github.event.inputs.date_to }}" \
            '{date_from: $f, date_to: $t} | with_entries(select(.value != ""))')
          RESP=$(curl -sS --fail-with-body -X POST \
            "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/aggregator/urbanpiper/sync" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            --max-time 600 -d "$BODY")
          echo "$RESP"
          echo "$RESP" | jq -e '.ok == true' > /dev/null
