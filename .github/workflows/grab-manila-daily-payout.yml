name: Grab Manila — Daily Payout Extraction

on:
  schedule:
    # Every day at 23:15 UTC = 07:15 PHT (after FoodPanda at 23:05)
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Period start (YYYY-MM-DD). Default: 30 days ago.'
        required: false
        default: ''
      date_to:
        description: 'Period end (YYYY-MM-DD). Default: yesterday (PHT).'
        required: false
        default: ''
      store:
        description: 'Which store: all (default) | paranaque | taft | qc'
        required: false
        default: ''

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Pure HTTP — fast (no Playwright)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'  # Node 20 has built-in fetch

      - name: Calculate date range (rolling 30 days, PHT)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date_to }}" ]; then
            DATE_TO="${{ github.event.inputs.date_to }}"
          else
            DATE_TO=$(python3 -c "from datetime import datetime, timedelta, timezone; pht = timezone(timedelta(hours=8)); print((datetime.now(pht) - timedelta(days=1)).strftime('%Y-%m-%d'))")
          fi
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            DATE_FROM="${{ github.event.inputs.date_from }}"
          else
            DATE_FROM=$(python3 -c "from datetime import datetime, timedelta, timezone; pht = timezone(timedelta(hours=8)); print((datetime.now(pht) - timedelta(days=30)).strftime('%Y-%m-%d'))")
          fi
          echo "DATE_FROM=$DATE_FROM" >> $GITHUB_ENV
          echo "DATE_TO=$DATE_TO"     >> $GITHUB_ENV
          echo "Extracting Grab PH payouts: $DATE_FROM → $DATE_TO"

      # Grab PH keeps each branch behind its own login: one session sees exactly
      # one store (measured 2026-09-05 — the Paranaque session returns only
      # "Sushi Zen - Paranaque", the Cubao session only "Sushizen Japanese
      # Restaurant - Quezon City"). So this runs once per store, the way the
      # FoodPanda workflow already does.
      #
      # Until 2026-09-05 only Paranaque ran here and the other two were done by
      # hand. That held up for months and then quietly stopped: TAFT and CUB
      # have nothing after 2026-09-02 while PAR kept going.
      #
      # Every store step is `if: always()` so one expired session cannot skip
      # the others (lesson 17). The job still ends red, so a stuck store is
      # never reported as success (lesson 47).

      - name: Extract Paranaque payouts
        if: ${{ github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'paranaque' }}
        run: node scripts/grab/get-payouts.js
        env:
          DATE_FROM:           ${{ env.DATE_FROM }}
          DATE_TO:             ${{ env.DATE_TO }}
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_STORE_CODE:     PAR
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_PARANAQUE }}
        timeout-minutes: 4

      - name: Extract Taft payouts
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'taft') }}
        run: node scripts/grab/get-payouts.js
        env:
          DATE_FROM:           ${{ env.DATE_FROM }}
          DATE_TO:             ${{ env.DATE_TO }}
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_STORE_CODE:     TAFT
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_TAFT }}
        timeout-minutes: 4

      # The login is called "qc" but Grab settles this branch as Cubao, so the
      # store code is CUB while the secret keeps the login's name. Renaming
      # either one would orphan existing rows / the existing secret.
      - name: Extract Cubao (QC) payouts
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'qc') }}
        run: node scripts/grab/get-payouts.js
        env:
          DATE_FROM:           ${{ env.DATE_FROM }}
          DATE_TO:             ${{ env.DATE_TO }}
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_STORE_CODE:     CUB
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_QC }}
        timeout-minutes: 4

      # ── Order ledger (Prep Time) ────────────────────────────────────────
      # Same sessions, same schedule, separate concern: payouts answer "what
      # were we paid", orders answer "was the kitchen late". Prep Time used to
      # come from staff photographing receipts, which caught 24% of Cubao's
      # orders and read the time wrong in a third of the rest.
      #
      # A 3-day window, not 1: the ledger is upserted on long_order_id, so
      # re-reading yesterday and the day before costs nothing and closes the gap
      # when a session was dead for a night.
      #
      # Every store is `if: always()` for the same reason as the payout steps --
      # one expired session must not skip the other two (lesson 17). The job
      # still ends red so a stuck store cannot look successful (lesson 47).
      - name: Extract Paranaque orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'paranaque') }}
        run: node scripts/grab/get-orders.js paranaque $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d) > /dev/null
        env:
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_PARANAQUE }}
        timeout-minutes: 6

      - name: Extract Taft orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'taft') }}
        run: node scripts/grab/get-orders.js taft $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d) > /dev/null
        env:
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_TAFT }}
        timeout-minutes: 6

      - name: Extract Cubao (QC) orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'qc') }}
        run: node scripts/grab/get-orders.js qc $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d) > /dev/null
        env:
          WEBHOOK_URL:         https://sushizen-shift-app-038d846023bc.herokuapp.com
          GRAB_SESSION_STATE:  ${{ secrets.GRAB_SESSION_QC }}
        timeout-minutes: 6

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            -d "{\"city\":\"manila\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
