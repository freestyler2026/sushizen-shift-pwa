name: FoodPanda — API Discovery (temporary, delete after use)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install playwright --no-save
          npx playwright install chromium --with-deps
        timeout-minutes: 8

      - name: Discover finance API via portal navigation
        run: node scripts/foodpanda/discover-finance-api.js paranaque
        env:
          FP_EMAIL_PARANAQUE:    ${{ secrets.FP_EMAIL_PARANAQUE }}
          FP_PASSWORD_PARANAQUE: ${{ secrets.FP_PASSWORD_PARANAQUE }}
        timeout-minutes: 4
