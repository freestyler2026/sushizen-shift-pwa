name: FoodPanda — API Discovery (temporary, delete after use)

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Account to inspect: paranaque | taft | qc'
        required: false
        default: 'qc'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install playwright --no-save
          npx playwright install chromium --with-deps
        timeout-minutes: 8

      # Does the portal expose the order code next to the money? Without it a
      # cancellation cannot be matched, so this decides whether the FoodPanda
      # side of the refund workflow can be automated at all.
      - name: Look for per-order refund detail
        run: node scripts/foodpanda/discover-order-transactions.js ${{ github.event.inputs.location || 'qc' }}
        env:
          FP_SESSION_PARANAQUE: ${{ secrets.FP_SESSION_PARANAQUE }}
          FP_SESSION_TAFT:      ${{ secrets.FP_SESSION_TAFT }}
          FP_SESSION_QC:        ${{ secrets.FP_SESSION_QC }}
        timeout-minutes: 10
