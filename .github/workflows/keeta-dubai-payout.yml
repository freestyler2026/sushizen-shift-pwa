name: Keeta Dubai — Settlement Payout Extract

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to skip posting to backend (no WEBHOOK_URL)'
        required: false
        default: 'false'

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install playwright xlsx --no-save
        working-directory: ${{ github.workspace }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ${{ github.workspace }}

      - name: Extract Keeta settlement payouts
        run: node scripts/keeta/get-payouts.js
        env:
          KEETA_SESSION: ${{ secrets.KEETA_SESSION }}
          WEBHOOK_URL:   ${{ github.event.inputs.dry_run == 'true' && '' || 'https://sushizen-shift-app-038d846023bc.herokuapp.com' }}
        timeout-minutes: 12

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -d "{\"city\":\"dubai\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
