name: Keeta Dubai — Settlement Payout Extract

on:
  # Keeta's session cookie runs to 2027-02, so unlike Careem this needs no
  # weekly login and can simply be scheduled. Cycles close Sunday and settle a
  # few days later, so Wednesday picks up a fully settled week.
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to skip posting to backend (no WEBHOOK_URL)'
        required: false
        default: 'false'
      generate_from:
        description: 'Backfill: generate reports from (YYYY-MM-DD). Default: last 35 days.'
        required: false
        default: ''
      generate_to:
        description: 'Backfill: generate reports to (YYYY-MM-DD). Default: today.'
        required: false
        default: ''

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The secrets context is not dependable inside a step-level `if`, so the second
    # account's session is surfaced as an env var the condition can read.
    env:
      KEETA_RZ_SESSION: ${{ secrets.KEETA_RZ_SESSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install playwright xlsx --no-save
        working-directory: ${{ github.workspace }}

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: ${{ github.workspace }}

      # Keeta gives each brand its own login, so one session only ever sees one
      # brand's restaurants. Running Sushi ZEN alone is why Ramen ZEN's settlements
      # never reached the OS while its money did reach the bank.
      - name: Extract Keeta settlement payouts — Sushi ZEN
        run: node scripts/keeta/get-payouts.js
        env:
          KEETA_SESSION:  ${{ secrets.KEETA_SESSION }}
          KEETA_BRAND:    sushi_zen
          WEBHOOK_URL:    ${{ github.event.inputs.dry_run != 'true' && 'https://sushizen-shift-app-038d846023bc.herokuapp.com' || '' }}
          GENERATE_FROM:  ${{ github.event.inputs.generate_from }}
          GENERATE_TO:    ${{ github.event.inputs.generate_to }}
        timeout-minutes: 12

      - name: Extract Keeta settlement payouts — Ramen ZEN
        # Runs only once the second account's session secret exists, and never blocks
        # the Sushi ZEN extract above.
        if: ${{ always() && env.KEETA_RZ_SESSION != '' }}
        run: node scripts/keeta/get-payouts.js
        env:
          KEETA_SESSION:  ${{ env.KEETA_RZ_SESSION }}
          KEETA_BRAND:    ramen_zen
          WEBHOOK_URL:    ${{ github.event.inputs.dry_run != 'true' && 'https://sushizen-shift-app-038d846023bc.herokuapp.com' || '' }}
          GENERATE_FROM:  ${{ github.event.inputs.generate_from }}
          GENERATE_TO:    ${{ github.event.inputs.generate_to }}
        timeout-minutes: 12

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            -d "{\"city\":\"dubai\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
