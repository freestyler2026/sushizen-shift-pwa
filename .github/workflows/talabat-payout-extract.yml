name: Talabat Dubai — Payout Extraction

on:
  schedule:
    # Daily at 02:00 UTC = 6:00 AM Dubai.
    #
    # This ran on the 5th of each month, but Talabat settles every three or
    # four days -- so the record sat up to a month behind its own source, and
    # on 2026-09-01 it was fifteen days stale with two settled payouts sitting
    # in the portal unfetched. The gap looked exactly like an expired session
    # and was not one: the session was fine, nothing had asked it for the data.
    #
    # A daily run against a rolling window costs one API call per chain and
    # keeps the record within a day of the source. Re-posting a payout already
    # held is harmless: the endpoint upserts on payout_id.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Start date (YYYY-MM-DD). Default: 1st of previous month.'
        required: false
        default: ''
      date_to:
        description: 'End date (YYYY-MM-DD). Default: last day of previous month.'
        required: false
        default: ''

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright --no-save
          npx playwright install chromium --with-deps
        timeout-minutes: 8

      - name: Decode Talabat session state
        run: |
          echo "${{ secrets.TALABAT_SESSION_STATE }}" | base64 -d > /tmp/talabat-state.json.gz
          gunzip /tmp/talabat-state.json.gz

      - name: Refresh Bearer token (headless)
        run: node scripts/talabat/refresh-token.js
        env:
          TALABAT_SESSION_PATH: /tmp/talabat-state.json
        timeout-minutes: 5

      - name: Calculate date range (previous month)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            echo "DATE_FROM=${{ github.event.inputs.date_from }}" >> $GITHUB_ENV
            echo "DATE_TO=${{ github.event.inputs.date_to }}" >> $GITHUB_ENV
          else
            # Previous month: 1st → last day
            # A rolling 45 days, not "last calendar month": on a daily
            # schedule the previous month is the wrong window for most of the
            # month, and the overlap re-confirms recent payouts cheaply.
            DATE_FROM=$(date -d '45 days ago' +%Y-%m-%d)
            DATE_TO=$(date +%Y-%m-%d)
            echo "DATE_FROM=$DATE_FROM" >> $GITHUB_ENV
            echo "DATE_TO=$DATE_TO" >> $GITHUB_ENV
          fi
          echo "Extracting payouts for: $DATE_FROM → $DATE_TO"

      - name: Run gross sales extractor (per-outlet, 14 vendors)
        run: node scripts/talabat/get-payouts.js
        env:
          TALABAT_SESSION_PATH: /tmp/talabat-state.json
          DATE_FROM: ${{ env.DATE_FROM }}
          DATE_TO: ${{ env.DATE_TO }}
          WEBHOOK_URL: https://sushizen-shift-app-038d846023bc.herokuapp.com/api/talabat/portal-payout-record
        timeout-minutes: 10

      - name: Run net payout extractor (per-chain, 4 billing chains)
        run: node scripts/talabat/get-net-payouts.js
        env:
          TALABAT_SESSION_PATH: /tmp/talabat-state.json
          DATE_FROM: ${{ env.DATE_FROM }}
          DATE_TO: ${{ env.DATE_TO }}
          WEBHOOK_URL: https://sushizen-shift-app-038d846023bc.herokuapp.com/api/talabat/portal-payout-record
        timeout-minutes: 10

      # Steps 1 and 2 carry the payout data; this only splits chain totals across
      # outlets and needs gross sales, which Talabat is answering 403 for. Let it
      # report and move on rather than failing a run that already did its job.
      - name: Run per-outlet net payout allocation
        continue-on-error: true
        run: |
          echo "Calling allocation endpoint for $DATE_FROM → $DATE_TO"
          RESULT=$(curl -sf -X POST \
            "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/talabat/run-payout-allocation?period_start=${DATE_FROM}&period_end=${DATE_TO}&secret=${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('ok'):
            print('ERROR:', d.get('error', 'unknown'))
            sys.exit(1)
          print(f'Allocated {d[\"records_written\"]} records')
          for store, amt in d['store_totals_aed'].items():
              print(f'  {store}: {amt} AED')
          "
        timeout-minutes: 3
