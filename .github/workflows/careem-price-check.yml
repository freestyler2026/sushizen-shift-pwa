name: Careem Price Check

on:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'  # Every 4 hours (UTC): 1,5,9,13,17,21 = 5am,9am,1pm,5pm,9pm,1am Dubai time
  workflow_dispatch:  # Manual run button on GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Restore Careem session state
        run: |
          echo "${{ secrets.CAREEM_SESSION_STATE }}" | base64 -d > /tmp/careem-state.json

      - name: Run price check
        run: node scripts/careem/check-prices.js
        env:
          CAREEM_SESSION_PATH: /tmp/careem-state.json
          WEBHOOK_URL: https://sushizen-shift-app-038d846023bc.herokuapp.com/api/careem/portal-price-snapshot
