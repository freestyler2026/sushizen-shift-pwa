name: Noon Food Dubai — Biweekly Payout Extract

on:
  # No schedule: Noon's session dies after about 2.6 days, so a weekly cron
  # failed on every run it ever made — six failures out of eight, with the only
  # successes coming from a manual run right after a fresh login. Run this by
  # hand after `node scripts/noon/setup-session.js --upload`; the Tuesday
  # reminder covers it alongside Careem.
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Set to "1" to extract ALL historical payouts since 2020'
        required: false
        default: ''
      since_date:
        description: 'Extract payouts since this date (YYYY-MM-DD). Leave blank for last 60 days.'
        required: false
        default: ''
      dry_run:
        description: 'Set to "true" to skip posting to backend'
        required: false
        default: 'false'

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Noon biweekly payouts (direct HTTP — no browser required)
        run: node scripts/noon/get-payouts.js
        env:
          NOON_SESSION:  ${{ secrets.NOON_SESSION }}
          NOON_BACKFILL: ${{ github.event.inputs.backfill }}
          NOON_SINCE:    ${{ github.event.inputs.since_date }}
          # Keep the URL on the LEFT of &&. Written as `dry_run == 'true' && '' || URL`
          # this silently ignored dry_run: '' is falsy, so `||` always fell through to
          # the URL and a "dry" run posted for real. Found 2026-09-05 on a run that was
          # supposed to write nothing and wrote 10 payouts.
          WEBHOOK_URL:   ${{ github.event.inputs.dry_run != 'true' && 'https://sushizen-shift-app-038d846023bc.herokuapp.com' || '' }}
        timeout-minutes: 8

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            -d "{\"city\":\"dubai\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
