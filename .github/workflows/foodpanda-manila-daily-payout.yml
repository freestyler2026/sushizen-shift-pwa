name: FoodPanda Manila — Daily Payout Extraction

on:
  schedule:
    # Every day at 23:05 UTC = 07:05 PHT (after midnight Manila time, previous day closed)
    - cron: '5 23 * * *'
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Period start (YYYY-MM-DD). Default: 30 days ago.'
        required: false
        default: ''
      date_to:
        description: 'Period end (YYYY-MM-DD). Default: yesterday (PHT).'
        required: false
        default: ''
      location:
        description: 'Account to run: paranaque | taft | qc | all'
        required: false
        default: 'all'

jobs:
  extract-payouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Calculate date range (rolling 30 days, PHT)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.date_to }}" ]; then
            DATE_TO="${{ github.event.inputs.date_to }}"
          else
            DATE_TO=$(python3 -c "from datetime import datetime, timedelta, timezone; pht = timezone(timedelta(hours=8)); print((datetime.now(pht) - timedelta(days=1)).strftime('%Y-%m-%d'))")
          fi
          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            DATE_FROM="${{ github.event.inputs.date_from }}"
          else
            DATE_FROM=$(python3 -c "from datetime import datetime, timedelta, timezone; pht = timezone(timedelta(hours=8)); print((datetime.now(pht) - timedelta(days=30)).strftime('%Y-%m-%d'))")
          fi
          echo "DATE_FROM=$DATE_FROM" >> $GITHUB_ENV
          echo "DATE_TO=$DATE_TO"     >> $GITHUB_ENV
          echo "Extracting FoodPanda PH payouts: $DATE_FROM to $DATE_TO"

      - name: Extract Paranaque payouts
        if: ${{ github.event.inputs.location == '' || github.event.inputs.location == 'all' || github.event.inputs.location == 'paranaque' }}
        run: node scripts/foodpanda/get-payouts.js paranaque
        env:
          DATE_FROM:              ${{ env.DATE_FROM }}
          DATE_TO:                ${{ env.DATE_TO }}
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_PARANAQUE:   ${{ secrets.FP_SESSION_PARANAQUE }}
        timeout-minutes: 8

      - name: Extract Taft payouts
        if: ${{ github.event.inputs.location == '' || github.event.inputs.location == 'all' || github.event.inputs.location == 'taft' }}
        run: node scripts/foodpanda/get-payouts.js taft
        env:
          DATE_FROM:              ${{ env.DATE_FROM }}
          DATE_TO:                ${{ env.DATE_TO }}
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_TAFT:        ${{ secrets.FP_SESSION_TAFT }}
        timeout-minutes: 8

      - name: Extract QC payouts
        if: ${{ github.event.inputs.location == '' || github.event.inputs.location == 'all' || github.event.inputs.location == 'qc' }}
        run: node scripts/foodpanda/get-payouts.js qc
        env:
          DATE_FROM:              ${{ env.DATE_FROM }}
          DATE_TO:                ${{ env.DATE_TO }}
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_QC:          ${{ secrets.FP_SESSION_QC }}
        timeout-minutes: 8

      # ── Order ledger ────────────────────────────────────────────────────
      # Same sessions, same schedule, different question: payouts say what we
      # were paid, orders say whether the platform was actually switched on.
      # Manila had a ledger for Grab only, so two of the three aggregators the
      # Daily Check asks about could not be answered from data at all.
      #
      # A 3-day window because the ledger upserts on (platform, order_id):
      # re-reading the last two days costs nothing and closes the gap left by a
      # night when the session was dead.
      #
      # Every store is `if: always()` so one expired session cannot skip the
      # others (lesson 17); the job still ends red so a stuck store is never
      # reported as success (lesson 47).
      #
      # ⚠️ PerimeterX refuses the first ListOrders of every run. The script
      # expects that and retries by reloading the page -- a 403 in the log is
      # normal, an empty capture is not and exits non-zero.
      - name: Extract Paranaque orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'paranaque') }}
        run: node scripts/foodpanda/get-orders.js paranaque $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d)
        env:
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_PARANAQUE:   ${{ secrets.FP_SESSION_PARANAQUE }}
        timeout-minutes: 8

      - name: Extract Taft orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'taft') }}
        run: node scripts/foodpanda/get-orders.js taft $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d)
        env:
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_TAFT:        ${{ secrets.FP_SESSION_TAFT }}
        timeout-minutes: 8

      # The login is "qc"; FoodPanda's vendor is "Sushi Zen - Cubao" and the
      # store code is CUB. The script reads the store from the vendor id on
      # each row, never from this argument.
      - name: Extract QC orders
        if: ${{ always() && (github.event.inputs.store == '' || github.event.inputs.store == 'all' || github.event.inputs.store == 'qc') }}
        run: node scripts/foodpanda/get-orders.js qc $(date -u -d '3 days ago' +%Y-%m-%d) $(date -u +%Y-%m-%d)
        env:
          WEBHOOK_URL:            https://sushizen-shift-app-038d846023bc.herokuapp.com
          FP_SESSION_QC:          ${{ secrets.FP_SESSION_QC }}
        timeout-minutes: 8

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            -d "{\"city\":\"manila\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
