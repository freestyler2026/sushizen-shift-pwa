name: Noon Food Price Check

on:
  schedule:
    - cron: '30 1,5,9,13,17,21 * * *'  # Every 4 hours (UTC): offset 30min from Careem check
  workflow_dispatch:  # Manual run button on GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Restore Noon session state
        run: |
          echo "${{ secrets.NOON_SESSION_STATE }}" | base64 -d > /tmp/noon-state.json

      - name: Run price check
        run: node scripts/noon/check-prices.js
        env:
          NOON_SESSION_PATH: /tmp/noon-state.json
          WEBHOOK_URL: https://sushizen-shift-app-038d846023bc.herokuapp.com/api/noon/portal-price-snapshot
