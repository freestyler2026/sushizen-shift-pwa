name: Careem Dubai — Payout Extract (cycles + balances)

on:
  # Restored 2026-09-05. The schedule was dropped on 2026-08-24 when Dubai moved
  # to manual upload, and Careem then imported nothing for ten days -- the gap was
  # only noticed because somebody went looking. The portal extract works fine; it
  # was simply that nobody was triggering it.
  #
  # Note on failures: the Careem session lives 72 hours and CI cannot write a
  # refreshed one back to the secret, so this job starts failing about three days
  # after each manual refresh. That is the intended behaviour -- a job that fails
  # loudly every morning is what tells you the session needs renewing. Silence is
  # what cost ten days.
  #
  # Careem PDFs must not be uploaded through the manual AR Payouts zone while this
  # runs: that path keys rows as careem_{brand}_{store}_{start}_{end} while this
  # one uses careem_cycle_{STORE}_{start}, so the same payout would be stored
  # twice under different ids. No Careem PDF has ever been uploaded (450 portal
  # rows, 0 manual), so the two have never collided.
  schedule:
    # 02:00 UTC = 06:00 GST (Dubai)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Snapshot date (YYYY-MM-DD). Default: today (GST).'
        required: false
        default: ''
      cycle_from:
        description: 'Payment Summary cycles from (YYYY-MM-DD). Default: 60 days back.'
        required: false
        default: ''
      cycle_to:
        description: 'Payment Summary cycles to (YYYY-MM-DD). Default: snapshot date.'
        required: false
        default: ''

jobs:
  snapshot-balances:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          cd /Users/jaynishimura/Desktop/sushizen-shift-pwa 2>/dev/null || true
          npm install playwright --no-save
          npx playwright install chromium --with-deps
        working-directory: ${{ github.workspace }}

      - name: Calculate snapshot date (GST = UTC+4)
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.snapshot_date }}" ]; then
            SNAPSHOT_DATE="${{ github.event.inputs.snapshot_date }}"
          else
            SNAPSHOT_DATE=$(python3 -c "from datetime import datetime, timedelta, timezone; gst = timezone(timedelta(hours=4)); print(datetime.now(gst).strftime('%Y-%m-%d'))")
          fi
          echo "SNAPSHOT_DATE=$SNAPSHOT_DATE" >> $GITHUB_ENV
          echo "Snapshot date (GST): $SNAPSHOT_DATE"

      - name: Extract Careem balance snapshots
        run: node scripts/careem/get-payouts.js
        env:
          SNAPSHOT_DATE:  ${{ env.SNAPSHOT_DATE }}
          CYCLE_FROM:     ${{ github.event.inputs.cycle_from }}
          CYCLE_TO:       ${{ github.event.inputs.cycle_to }}
          WEBHOOK_URL:    https://sushizen-shift-app-038d846023bc.herokuapp.com
          CAREEM_SESSION: ${{ secrets.CAREEM_SESSION }}
        timeout-minutes: 8

      - name: Refresh Daily P&L cache
        if: always()
        run: |
          DATE_FROM=$(date -u -d '35 days ago' +%Y-%m-%d)
          DATE_TO=$(date -u +%Y-%m-%d)
          curl -s -X POST "https://sushizen-shift-app-038d846023bc.herokuapp.com/api/admin/mgmt/daily-pl/refresh" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.MGMT_CRON_SECRET }}" \
            -d "{\"city\":\"dubai\",\"date_from\":\"${DATE_FROM}\",\"date_to\":\"${DATE_TO}\"}" || true
